<svg viewBox="0 0 560 500" role="img" aria-labelledby="ex-title ex-desc">
<title id="ex-title">문서 검색 경로에 재순위 단계를 새로 넣고, 답변 캐시는 조건부로 검토하는 구조</title>
<desc id="ex-desc">질문은 기존 벡터 검색으로 들어가 후보 문서 20건을 얻습니다. 새로 추가하는 재순위 단계가 후보를 5건으로 줄여 확정된 답변 생성 단계로 넘깁니다. 재순위 단계의 응답 지연은 아직 측정되지 않았습니다. 답변 캐시는 지연 측정 결과에 따라 도입을 결정하는 조건부 제안입니다.</desc>
<defs>
<marker id="ex-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/>
</marker>
</defs>
<rect x="10" y="10" width="540" height="352" rx="12" fill="var(--band)" stroke="var(--line)"/>
<text x="30" y="42" font-size="17" font-weight="700" fill="var(--muted)">검색 경로</text>
<line x1="280" y1="118" x2="280" y2="146" stroke="var(--muted)" stroke-width="2" marker-end="url(#ex-arr)"/>
<line x1="280" y1="222" x2="280" y2="250" stroke="var(--muted)" stroke-width="2" marker-end="url(#ex-arr)"/>
<text x="296" y="140" font-size="17" fill="var(--muted)">후보 20건</text>
<text x="296" y="244" font-size="17" fill="var(--muted)">상위 5건</text>
<rect x="110" y="58" width="340" height="60" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
<text x="280" y="95" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">벡터 검색</text>
<rect x="110" y="150" width="340" height="72" rx="10" fill="var(--new-bg)" stroke="var(--new)" stroke-width="2"/>
<text x="280" y="181" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">재순위 단계</text>
<text x="280" y="207" font-size="17" text-anchor="middle" fill="var(--muted)">질문과 후보를 다시 비교</text>
<rect x="110" y="254" width="340" height="60" rx="10" fill="var(--ok-bg)" stroke="var(--ok)" stroke-width="2"/>
<text x="280" y="291" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">답변 생성</text>
<circle cx="110" cy="150" r="14" fill="var(--ink)"/>
<text x="110" y="156" font-size="17" font-weight="700" text-anchor="middle" fill="var(--panel)">1</text>
<rect x="110" y="326" width="340" height="26" rx="13" fill="var(--key)"/>
<text x="280" y="345" font-size="17" font-weight="700" text-anchor="middle" fill="var(--ink)">후보 20건 → 5건</text>
<rect x="10" y="380" width="262" height="104" rx="10" fill="var(--risk-bg)" stroke="var(--risk)" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="141" y="422" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">재순위 응답 지연</text>
<text x="141" y="452" font-size="17" text-anchor="middle" fill="var(--ink)">미측정</text>
<rect x="288" y="380" width="262" height="104" rx="10" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="419" y="422" font-size="18" font-weight="700" text-anchor="middle" fill="var(--ink)">답변 캐시</text>
<text x="419" y="452" font-size="17" text-anchor="middle" fill="var(--muted)">지연 측정 뒤 결정</text>
</svg>
