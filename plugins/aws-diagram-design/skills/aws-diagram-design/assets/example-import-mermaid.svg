<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" role="img" aria-labelledby="import-mermaid-title import-mermaid-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="import-mermaid-title">Request validation flow</title>
      <desc id="import-mermaid-desc">Web and mobile requests enter an API gateway, pass a token decision, and reach an order service and Postgres.</desc>
      <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
/* /page-css */
    </style>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#eb6c36"/></marker>
      </defs>
      <rect width="960" height="600" fill="#f5f5f5"/>

      <rect x="40" y="80" width="200" height="336" rx="8" fill="none" stroke="rgba(45,49,66,0.12)"/>
      <text x="56" y="104" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">EDGE</text>
      <rect x="288" y="80" width="632" height="336" rx="8" fill="none" stroke="rgba(45,49,66,0.12)"/>
      <text x="304" y="104" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">CORE SERVICES</text>

      <!-- Connectors precede nodes. -->
      <path d="M208,168 H328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M208,296 H264 A8,8 0 0 0 272,288 V200 A8,8 0 0 1 280,192 H328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M488,192 H568" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M696,192 H744 A8,8 0 0 1 752,200 V272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M632,256 V336 A8,8 0 0 1 624,344 H488 A8,8 0 0 1 480,336 V232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M408,160 V136 A8,8 0 0 1 416,128 H504 A8,8 0 0 1 512,136 V168 A8,8 0 0 1 504,176 H488" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
      <path d="M752,336 V352 A8,8 0 0 1 744,360 H696 A8,8 0 0 0 688,368 V384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="240" y="148" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="268" y="156" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">REQUEST</text>
      <rect x="220" y="276" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="248" y="284" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">REQUEST</text>
      <rect x="504" y="172" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="528" y="180" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">VERIFY</text>
      <rect x="708" y="172" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="724" y="180" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">YES</text>
      <rect x="544" y="324" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="560" y="332" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">NO</text>
      <rect x="432" y="108" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="456" y="116" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">RETRY</text>
      <rect x="696" y="340" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="720" y="348" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">WRITES</text>

      <rect x="64" y="140" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/><text x="136" y="172" fill="#2d3142" font-size="12" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">Web App</text>
      <rect x="64" y="268" width="144" height="56" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/><text x="136" y="300" fill="#2d3142" font-size="12" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">Mobile App</text>
      <rect x="328" y="160" width="160" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="408" y="188" fill="#2d3142" font-size="12" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">API Gateway</text><text x="408" y="204" fill="#4f5d75" font-size="11" font-family="'Geist',sans-serif" text-anchor="middle">single entry</text>
      <polygon points="632,128 696,192 632,256 568,192" fill="#ffffff" stroke="#2d3142"/><text x="632" y="188" fill="#2d3142" font-size="12" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">Token</text><text x="632" y="204" fill="#2d3142" font-size="12" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">valid?</text>
      <rect x="744" y="272" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="824" y="300" fill="#2d3142" font-size="12" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">Orders Service</text><text x="824" y="316" fill="#4f5d75" font-size="11" font-family="'Geist',sans-serif" text-anchor="middle">order write</text>
      <rect x="608" y="384" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="688" y="408" fill="#2d3142" font-size="12" font-family="'Geist',sans-serif" font-weight="600" text-anchor="middle">Postgres</text><text x="688" y="424" fill="#4f5d75" font-size="11" font-family="'Geist',sans-serif" text-anchor="middle">orders</text>
</svg>
