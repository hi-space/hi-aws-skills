<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quadrant-consultant-title quadrant-consultant-desc">
        <title id="quadrant-consultant-title">Workplace 2030 · Remote × AI automation</title>
        <desc id="quadrant-consultant-desc">Scenario matrix showing four workplace futures across remote-to-in-person and human-to-AI axes, with agent teams as the headline bet.</desc>
        <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
/* /page-css */
    </style>
          <!-- Double-ended axis markers -->
          <marker id="axis-end" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
            <polygon points="0 0, 9 3.5, 0 7" fill="#232F3E"/>
          </marker>
          <marker id="axis-start" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto">
            <polygon points="9 0, 0 3.5, 9 7" fill="#232F3E"/>
          </marker>
        </defs>

        <!-- Clean paper background, no dot pattern -->
        <rect width="100%" height="100%" fill="#FFFFFF"/>

        <!-- Focal quadrant tint (TR) — coral at 3% -->
        <rect x="500" y="80" width="400" height="220" fill="rgba(255,153,0,0.04)"/>

        <!-- Scenario cells — store treatment with hairline rule, slightly varied -->
        <!-- TL: Distributed humans -->
        <rect x="140" y="120" width="300" height="160" rx="6" fill="rgba(35,47,62,0.04)" stroke="rgba(84,91,100,0.28)" stroke-width="1"/>
        <text x="156" y="144" fill="#545B64" font-size="8" font-weight="500" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">01 · REMOTE / HUMAN</text>
        <text x="156" y="180" fill="#232F3E" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Distributed humans</text>
        <text x="156" y="216" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Async-first, global hiring,</text>
        <text x="156" y="232" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Slack-heavy. Human-centric</text>
        <text x="156" y="248" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">workflows, low AI leverage.</text>

        <!-- TR: Agent teams (FOCAL) -->
        <rect x="560" y="120" width="300" height="160" rx="6" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1.2"/>
        <text x="576" y="144" fill="#EC7211" font-size="8" font-weight="600" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">02 · REMOTE / AI</text>
        <text x="576" y="180" fill="#232F3E" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Agent teams <tspan fill="#EC7211" font-size="13">●</tspan></text>
        <text x="576" y="216" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Humans orchestrate; AI</text>
        <text x="576" y="232" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">handles the routine layer.</text>
        <text x="576" y="248" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Small, high-leverage teams.</text>

        <!-- BL: Office classic -->
        <rect x="140" y="320" width="300" height="160" rx="6" fill="rgba(35,47,62,0.04)" stroke="rgba(84,91,100,0.28)" stroke-width="1"/>
        <text x="156" y="344" fill="#545B64" font-size="8" font-weight="500" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">03 · IN-PERSON / HUMAN</text>
        <text x="156" y="380" fill="#232F3E" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Office classic</text>
        <text x="156" y="416" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Return-to-office mandates,</text>
        <text x="156" y="432" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">manual work. Techlash</text>
        <text x="156" y="448" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">prolongs the status quo.</text>

        <!-- BR: In-person + AI -->
        <rect x="560" y="320" width="300" height="160" rx="6" fill="rgba(35,47,62,0.04)" stroke="rgba(84,91,100,0.28)" stroke-width="1"/>
        <text x="576" y="344" fill="#545B64" font-size="8" font-weight="500" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">04 · IN-PERSON / AI</text>
        <text x="576" y="380" fill="#232F3E" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">In-person + AI</text>
        <text x="576" y="416" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Smart offices, AI-augmented</text>
        <text x="576" y="432" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">staff. Physical presence is</text>
        <text x="576" y="448" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">the moat, AI is the lever.</text>

        <!-- Axis cross — double-ended; horizontal shortened so the labels flank the tips cleanly -->
        <line x1="200" y1="300" x2="800" y2="300"
              stroke="#232F3E" stroke-width="1.2"
              marker-start="url(#axis-start)" marker-end="url(#axis-end)"/>
        <line x1="500" y1="60" x2="500" y2="540"
              stroke="#232F3E" stroke-width="1.2"
              marker-start="url(#axis-start)" marker-end="url(#axis-end)"/>

        <!-- Axis labels — one word at each arrow tip. No glyphs, no parentheticals. -->
        <text x="500" y="48" fill="#232F3E" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">REMOTE</text>

        <text x="500" y="560" fill="#232F3E" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">IN-PERSON</text>

        <text x="188" y="300" fill="#232F3E" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end" dominant-baseline="middle" letter-spacing="0.18em">HUMAN</text>

        <text x="812" y="300" fill="#232F3E" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="start" dominant-baseline="middle" letter-spacing="0.18em">AI</text>
</svg>
