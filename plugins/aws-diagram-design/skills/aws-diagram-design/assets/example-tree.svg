<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 428" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tree-title tree-desc">
      <title id="tree-title">Claude Code skill taxonomy</title>
      <desc id="tree-desc">Tree diagram showing a Skills root branching into Design, Engineering, and Research categories and their leaf skills.</desc>
        <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
/* /page-css */
    </style>
        </defs>

        <rect width="100%" height="100%" fill="#FFFFFF"/>

        <!-- Tier tags (left margin) -->
        <text x="40" y="108" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
        <text x="40" y="224" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="start">TIER 1</text>
        <text x="40" y="324" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="start">TIER 2</text>

        <!-- Connectors drawn first (behind nodes) -->
        <!-- Root → Tier 1 bus -->
        <path d="M 500 128 L 500 168 L 220 168 L 220 208" fill="none" stroke="#545B64" stroke-width="1"/>
        <path d="M 500 168 L 500 208" fill="none" stroke="#545B64" stroke-width="1"/>
        <path d="M 500 168 L 780 168 L 780 208" fill="none" stroke="#545B64" stroke-width="1"/>

        <!-- Design → leaves -->
        <path d="M 220 256 L 220 296 L 140 296 L 140 336" fill="none" stroke="#545B64" stroke-width="1"/>
        <path d="M 220 296 L 300 296 L 300 336" fill="none" stroke="#545B64" stroke-width="1"/>

        <!-- Engineering → leaves -->
        <path d="M 500 256 L 500 296 L 480 296 L 480 336" fill="none" stroke="#545B64" stroke-width="1"/>
        <path d="M 500 296 L 660 296 L 660 336" fill="none" stroke="#545B64" stroke-width="1"/>

        <!-- Research → single leaf -->
        <path d="M 780 256 L 780 296 L 840 296 L 840 336" fill="none" stroke="#545B64" stroke-width="1"/>

        <!-- Root node: Skills (coral focal) -->
        <rect x="420" y="80" width="160" height="48" rx="6" fill="#FFFFFF"/>
        <rect x="420" y="80" width="160" height="48" rx="6" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
        <rect x="428" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
        <text x="444" y="97" fill="#EC7211" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="500" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Skills</text>

        <!-- Tier 1: Design -->
        <rect x="140" y="208" width="160" height="48" rx="6" fill="#FFFFFF"/>
        <rect x="140" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="148" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="162" y="225" fill="#232F3E" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="220" y="240" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Design</text>
        <text x="220" y="252" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">ui · visual · ux</text>

        <!-- Tier 1: Engineering -->
        <rect x="420" y="208" width="160" height="48" rx="6" fill="#FFFFFF"/>
        <rect x="420" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="428" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="442" y="225" fill="#232F3E" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="500" y="240" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Engineering</text>
        <text x="500" y="252" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">ship · review · test</text>

        <!-- Tier 1: Research -->
        <rect x="700" y="208" width="160" height="48" rx="6" fill="#FFFFFF"/>
        <rect x="700" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="708" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="722" y="225" fill="#232F3E" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="780" y="240" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Research</text>
        <text x="780" y="252" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">investigate · analyze</text>

        <!-- Tier 2: polish -->
        <rect x="60" y="336" width="160" height="48" rx="6" fill="#FFFFFF"/>
        <rect x="60" y="336" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
        <text x="140" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">polish</text>
        <text x="140" y="372" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">align · space · rhythm</text>

        <!-- Tier 2: critique -->
        <rect x="220" y="336" width="160" height="48" rx="6" fill="#FFFFFF"/>
        <rect x="220" y="336" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
        <text x="300" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">critique</text>
        <text x="300" y="372" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">hierarchy · density</text>

        <!-- Tier 2: review -->
        <rect x="400" y="336" width="160" height="48" rx="6" fill="#FFFFFF"/>
        <rect x="400" y="336" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
        <text x="480" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">review</text>
        <text x="480" y="372" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">pre-land diff · sql</text>

        <!-- Tier 2: ship -->
        <rect x="580" y="336" width="160" height="48" rx="6" fill="#FFFFFF"/>
        <rect x="580" y="336" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
        <text x="660" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">ship</text>
        <text x="660" y="372" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">merge · deploy · verify</text>

        <!-- Tier 2: investigate -->
        <rect x="760" y="336" width="160" height="48" rx="6" fill="#FFFFFF"/>
        <rect x="760" y="336" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
        <text x="840" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">investigate</text>
        <text x="840" y="372" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">root cause · evidence</text>
</svg>
