<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 444" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="swimlane-dark-title swimlane-dark-desc">
      <title id="swimlane-dark-title">Publishing an article</title>
      <desc id="swimlane-dark-desc">Swimlane diagram showing an article moving from MDX draft through review, editing, approval, build, and Cloudflare Pages deployment.</desc>
        <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
/* /page-css */
    </style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B6BEC9"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FF9900"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#161E2D"/>

        <!-- Lane dividers -->
        <line x1="40" y1="80" x2="960" y2="80" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
        <line x1="40" y1="160" x2="960" y2="160" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="40" y1="240" x2="960" y2="240" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="40" y1="320" x2="960" y2="320" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="40" y1="400" x2="960" y2="400" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

        <!-- Actor column divider -->
        <line x1="160" y1="80" x2="160" y2="400" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

        <!-- Lane labels -->
        <text x="60" y="124" fill="#B6BEC9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">AUTHOR</text>
        <text x="60" y="204" fill="#B6BEC9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">REVIEWER</text>
        <text x="60" y="284" fill="#B6BEC9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">EDITOR</text>
        <text x="60" y="364" fill="#B6BEC9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">CI / CD</text>

        <!-- Arrows (drawn first) -->
        <!-- 1. Draft → Open PR (within Author) -->
        <line x1="300" y1="120" x2="340" y2="120" stroke="#B6BEC9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 2. Open PR → Review (Author → Reviewer handoff, diagonal down-right) -->
        <line x1="460" y1="144" x2="500" y2="176" stroke="#B6BEC9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 3. Review → Polish (Reviewer → Editor, vertical down) -->
        <line x1="570" y1="224" x2="570" y2="256" stroke="#B6BEC9" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 4. Polish → Approve (within Editor) -->
        <line x1="640" y1="280" x2="680" y2="280" stroke="#B6BEC9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 5. Approve → Build (Editor → CI/CD, coral handoff) -->
        <line x1="750" y1="304" x2="720" y2="336" stroke="#FF9900" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 6. Build → Deploy (within CI/CD) -->
        <line x1="760" y1="360" x2="800" y2="360" stroke="#B6BEC9" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="478" y="140" width="60" height="12" rx="2" fill="#161E2D"/>
        <text x="508" y="150" fill="#B6BEC9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">HANDOFF</text>

        <rect x="548" y="228" width="52" height="12" rx="2" fill="#232F3E"/>
        <text x="574" y="238" fill="#B6BEC9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">REVISE</text>

        <rect x="712" y="308" width="80" height="12" rx="2" fill="#161E2D"/>
        <text x="752" y="318" fill="#FF9900" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">DEPLOY TRIGGER</text>

        <!-- Steps -->
        <!-- Author: Draft MDX -->
        <rect x="180" y="96" width="120" height="48" rx="6" fill="#232F3E" stroke="#FFFFFF" stroke-width="1"/>
        <text x="240" y="118" fill="#FFFFFF" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Draft MDX</text>
        <text x="240" y="132" fill="#B6BEC9" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">src/content/…</text>

        <!-- Author: Open PR -->
        <rect x="340" y="96" width="120" height="48" rx="6" fill="#232F3E" stroke="#FFFFFF" stroke-width="1"/>
        <text x="400" y="118" fill="#FFFFFF" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Open PR</text>
        <text x="400" y="132" fill="#B6BEC9" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">gh pr create</text>

        <!-- Reviewer: Review content -->
        <rect x="500" y="176" width="140" height="48" rx="6" fill="#232F3E" stroke="#FFFFFF" stroke-width="1"/>
        <text x="570" y="198" fill="#FFFFFF" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Review content</text>
        <text x="570" y="212" fill="#B6BEC9" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">fact-check · voice</text>

        <!-- Editor: Polish copy -->
        <rect x="500" y="256" width="140" height="48" rx="6" fill="#232F3E" stroke="#FFFFFF" stroke-width="1"/>
        <text x="570" y="278" fill="#FFFFFF" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Polish copy</text>
        <text x="570" y="292" fill="#B6BEC9" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">style · line edits</text>

        <!-- Editor: Approve merge -->
        <rect x="680" y="256" width="140" height="48" rx="6" fill="#232F3E" stroke="#FFFFFF" stroke-width="1"/>
        <text x="750" y="278" fill="#FFFFFF" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Approve merge</text>
        <text x="750" y="292" fill="#B6BEC9" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">squash · main</text>

        <!-- CI/CD: Build -->
        <rect x="680" y="336" width="80" height="48" rx="6" fill="#232F3E" stroke="#FFFFFF" stroke-width="1"/>
        <text x="720" y="358" fill="#FFFFFF" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Build</text>
        <text x="720" y="372" fill="#B6BEC9" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">astro build</text>

        <!-- CI/CD: Deploy (coral focal) -->
        <rect x="800" y="336" width="120" height="48" rx="6" fill="rgba(255,153,0,0.08)" stroke="#FF9900" stroke-width="1"/>
        <text x="860" y="358" fill="#FFFFFF" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Deploy</text>
        <text x="860" y="372" fill="#B6BEC9" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">cloudflare pages</text>
</svg>
