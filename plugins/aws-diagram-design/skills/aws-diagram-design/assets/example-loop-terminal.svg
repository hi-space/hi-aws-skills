<?xml version="1.0" encoding="UTF-8"?>
<svg
          viewBox="0 0 1040 680"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-labelledby="loop-terminal-title loop-terminal-desc"
        >
          <title id="loop-terminal-title">The self-improving loop</title>
          <desc id="loop-terminal-desc">
            Six stations flow clockwise from Capture through Learn and back to
            Capture. Each station writes shared state into one central memory
            hub, with Decide highlighted as the human approval gate.
          </desc>
          <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
:root { --page: #0a0a0a; --paper: #141414; --bar: #1b1b1b; --border: #2b2b2b; --ink: #f5f5f5; --muted: #9a9a9a; --soft: #5c5c5c; --accent: #ff5a36; --accent-tint: rgba(255, 90, 54, 0.12); --mono: "Geist Mono", ui-monospace, monospace; }
.ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
.station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
.station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; }
.hub { fill: var(--ink); }
.node-name { fill: var(--ink); font: 600 14px var(--mono); text-anchor: middle; }
.focal-name { fill: var(--accent); }
.sublabel { fill: var(--muted); font: 400 9.5px var(--mono); text-anchor: middle; }
.hub-name { fill: var(--paper); font: 700 18px var(--mono); text-anchor: middle; }
.hub-sub { fill: var(--paper); opacity: 0.7; font: 400 9.5px var(--mono); text-anchor: middle; }
.arrow-label { fill: var(--muted); font: 500 9px var(--mono); letter-spacing: 0.08em; text-anchor: middle; }
/* /page-css */
    </style>
            <pattern
              id="dots"
              width="22"
              height="22"
              patternUnits="userSpaceOnUse"
            >
              <circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.08)" />
            </pattern>
            <marker
              id="arrow"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#9a9a9a" />
            </marker>
            <marker
              id="arrow-soft"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#5c5c5c" />
            </marker>
          </defs>
          <rect width="1040" height="680" fill="#141414" />
          <rect width="1040" height="680" fill="url(#dots)" opacity="0.7" />

          <!-- Solid clockwise ring: six arcs on the same r=240 station circle. -->
          <path
            class="ring"
            d="M600 113.726 A240 240 0 0 1 704.969 187.073"
            marker-end="url(#arrow)"
          />
          <path
            class="ring"
            d="M743.285 252 A240 240 0 0 1 743.722 426.882"
            marker-end="url(#arrow)"
          />
          <path
            class="ring"
            d="M705.731 492 A240 240 0 0 1 601.130 565.871"
            marker-end="url(#arrow)"
          />
          <path
            class="ring"
            d="M440 566.274 A240 240 0 0 1 335.031 492.927"
            marker-end="url(#arrow)"
          />
          <path
            class="ring"
            d="M296.715 428 A240 240 0 0 1 296.278 253.118"
            marker-end="url(#arrow)"
          />
          <path
            class="ring"
            d="M334.269 188 A240 240 0 0 1 438.870 114.129"
            marker-end="url(#arrow)"
          />

          <!-- Dashed write-backs: station inner edge to 6px before the hub stroke. -->
          <path class="spoke" d="M520 132 V280" marker-end="url(#arrow-soft)" />
          <path
            class="spoke"
            d="M672 252 L616 284"
            marker-end="url(#arrow-soft)"
          />
          <path
            class="spoke"
            d="M672 428 L616 396"
            marker-end="url(#arrow-soft)"
          />
          <path class="spoke" d="M520 548 V400" marker-end="url(#arrow-soft)" />
          <path
            class="spoke"
            d="M368 428 L424 396"
            marker-end="url(#arrow-soft)"
          />
          <path
            class="spoke"
            d="M368 252 L424 284"
            marker-end="url(#arrow-soft)"
          />

          <!-- Curated spoke labels sit beside the line with an 8px visible gap. -->
          <rect x="530" y="199" width="52" height="17" rx="4" fill="#141414" />
          <text x="556" y="211.5" class="arrow-label">SIGNALS</text>
          <rect x="457" y="463" width="58" height="17" rx="4" fill="#141414" />
          <text x="486" y="475.5" class="arrow-label">OUTCOMES</text>

          <!-- Stations -->
          <rect class="station" x="440" y="68" width="160" height="64" rx="6" />
          <text x="520" y="96.5" class="node-name">Capture</text>
          <text x="520" y="116.5" class="sublabel">signals in / intake</text>

          <rect
            class="station"
            x="648"
            y="188"
            width="160"
            height="64"
            rx="6"
          />
          <text x="728" y="216.5" class="node-name">Research</text>
          <text x="728" y="236.5" class="sublabel">evidence pulled</text>

          <rect
            class="station focal"
            x="648"
            y="428"
            width="160"
            height="64"
            rx="6"
          />
          <text x="728" y="456.5" class="node-name focal-name">Decide</text>
          <text x="728" y="476.5" class="sublabel">human approves</text>

          <rect
            class="station"
            x="440"
            y="548"
            width="160"
            height="64"
            rx="6"
          />
          <text x="520" y="576.5" class="node-name">Act</text>
          <text x="520" y="596.5" class="sublabel">work ships</text>

          <rect
            class="station"
            x="232"
            y="428"
            width="160"
            height="64"
            rx="6"
          />
          <text x="312" y="456.5" class="node-name">Measure</text>
          <text x="312" y="476.5" class="sublabel">outcomes logged</text>

          <rect
            class="station"
            x="232"
            y="188"
            width="160"
            height="64"
            rx="6"
          />
          <text x="312" y="216.5" class="node-name">Learn</text>
          <text x="312" y="236.5" class="sublabel">playbook updated</text>

          <!-- The one shared-state hub. -->
          <rect class="hub" x="420" y="288" width="200" height="104" rx="8" />
          <text x="520" y="337.5" class="hub-name">Shared memory</text>
          <text x="520" y="360.5" class="hub-sub">one record, every loop</text>
        </svg>
