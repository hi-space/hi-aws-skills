<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medallion-dark-title medallion-dark-desc">
      <title id="medallion-dark-title">Five-tier e-commerce analytics medallion</title>
      <desc id="medallion-dark-desc">Clickstream events and order records move from raw storage through anonymized, staging, and aggregated tiers before lifecycle archiving.</desc>
      <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
:root { --paper: #161E2D; --paper-2: #232F3E; --ink: #FFFFFF; --muted: #B6BEC9; --soft: #8D99A8; --rule: rgba(255,255,255,0.12); --accent: #FF9900; --accent-tint: rgba(255,153,0,0.10); --link: #539FE5; --sans: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; --serif: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; --mono: 'Amazon Ember Mono', ui-monospace, monospace; }
.tier-title { fill: var(--ink); font: 600 13px var(--sans); text-anchor: middle; }
.bucket, .field-value, .example-value { fill: var(--muted); font: 400 9px var(--mono); }
.bucket { text-anchor: middle; }
.field-value { color: var(--muted); }
.focal-text { fill: var(--accent); }
.field-label { fill: var(--ink); font: 600 11px var(--sans); }
.example-label, .arc-label, .path-tag { font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
.example-label { fill: var(--soft); font-size: 8px; }
.arc-label { font-size: 10px; text-anchor: middle; }
.path-title { fill: var(--ink); font: 600 11px var(--sans); }
.path-sub { fill: var(--muted); font: 400 10px var(--sans); }
/* /page-css */
    </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B6BEC9"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FF9900"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#539FE5"/></marker>
        <clipPath id="clip-raw"><rect x="16" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-anon"><rect x="204" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-stage"><rect x="392" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-aggregate"><rect x="580" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-archive"><rect x="768" y="80" width="172" height="380" rx="6"/></clipPath>
      </defs>
      <rect width="1040" height="548" fill="#161E2D"/>

      <!-- Promotion arcs are the medallion type's required connector grammar. -->
      <path d="M102 80 C102 0 290 0 290 80" fill="none" stroke="#B6BEC9" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M290 80 C290 0 478 0 478 80" fill="none" stroke="#B6BEC9" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M478 80 C478 0 666 0 666 80" fill="none" stroke="#FF9900" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <path d="M666 80 C666 0 854 0 854 80" fill="none" stroke="#B6BEC9" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="196" y="50" class="arc-label" fill="#B6BEC9">MASK IDS</text>
      <text x="384" y="50" class="arc-label" fill="#B6BEC9">CLEAN + JOIN</text>
      <text x="572" y="50" class="arc-label" fill="#FF9900">AGGREGATE</text>
      <text x="760" y="50" class="arc-label" fill="#B6BEC9">LIFECYCLE</text>

      <!-- Raw -->
      <rect x="16" y="80" width="172" height="380" rx="6" fill="rgba(255,255,255,0.04)"/>
      <rect x="16" y="80" width="172" height="50" fill="rgba(141,153,168,0.16)" clip-path="url(#clip-raw)"/>
      <rect x="16" y="80" width="172" height="380" rx="6" fill="none" stroke="#B6BEC9"/>
      <text x="102" y="106" class="tier-title">Raw</text>
      <text x="102" y="144" class="bucket">raw-commerce</text>
      <text x="32" y="180" class="field-label">Tool</text>
      <text x="32" y="202" class="field-value">NiFi ingest</text>
      <text x="32" y="220" class="field-label">Format</text>
      <text x="32" y="242" class="field-value">JSON · Parquet</text>
      <text x="32" y="260" class="field-label">Writer</text>
      <text x="32" y="282" class="field-value">Data Engineer</text>
      <text x="32" y="360" class="example-label">E-COMMERCE EXAMPLE</text>
      <text x="32" y="374" class="example-value">clickstream events</text>
      <text x="32" y="388" class="example-value">order records</text>

      <!-- Anonymized -->
      <rect x="204" y="80" width="172" height="380" rx="6" fill="rgba(255,255,255,0.04)"/>
      <rect x="204" y="80" width="172" height="50" fill="rgba(255,255,255,0.08)" clip-path="url(#clip-anon)"/>
      <rect x="204" y="80" width="172" height="380" rx="6" fill="none" stroke="rgba(255,255,255,0.30)"/>
      <text x="290" y="106" class="tier-title">Anonymized</text>
      <text x="290" y="144" class="bucket">anon-commerce</text>
      <text x="220" y="180" class="field-label">Tool</text>
      <text x="220" y="202" class="field-value">Trino SQL</text>
      <text x="220" y="220" class="field-label">Format</text>
      <text x="220" y="242" class="field-value">Iceberg · partitioned</text>
      <text x="220" y="260" class="field-label">Writer</text>
      <text x="220" y="282" class="field-value">Data Engineer</text>
      <text x="220" y="360" class="example-label">E-COMMERCE EXAMPLE</text>
      <text x="220" y="374" class="example-value">session pseudonyms</text>
      <text x="220" y="388" class="example-value">masked customer IDs</text>

      <!-- Staging -->
      <rect x="392" y="80" width="172" height="380" rx="6" fill="rgba(255,255,255,0.04)"/>
      <rect x="392" y="80" width="172" height="50" fill="rgba(255,255,255,0.08)" clip-path="url(#clip-stage)"/>
      <rect x="392" y="80" width="172" height="380" rx="6" fill="none" stroke="rgba(255,255,255,0.30)"/>
      <text x="478" y="106" class="tier-title">Staging</text>
      <text x="478" y="144" class="bucket">staging-commerce</text>
      <text x="408" y="180" class="field-label">Tool</text>
      <text x="408" y="202" class="field-value">Trino · notebooks</text>
      <text x="408" y="220" class="field-label">Format</text>
      <text x="408" y="242" class="field-value">Iceberg · cleaned</text>
      <text x="408" y="260" class="field-label">Writer</text>
      <text x="408" y="282" class="field-value">Data Scientist</text>
      <text x="408" y="360" class="example-label">E-COMMERCE EXAMPLE</text>
      <text x="408" y="374" class="example-value">joined order facts</text>
      <text x="408" y="388" class="example-value">validated event rows</text>

      <!-- Aggregated focal tier -->
      <rect x="580" y="80" width="172" height="380" rx="6" fill="rgba(255,153,0,0.12)"/>
      <rect x="580" y="80" width="172" height="50" fill="rgba(255,153,0,0.20)" clip-path="url(#clip-aggregate)"/>
      <rect x="580" y="80" width="172" height="380" rx="6" fill="none" stroke="#FF9900" stroke-width="1.6"/>
      <text x="666" y="106" class="tier-title">Aggregated</text>
      <text x="666" y="144" class="bucket focal-text">analytics-marts</text>
      <text x="596" y="180" class="field-label">Tool</text>
      <text x="596" y="202" class="field-value">Trino INSERT</text>
      <text x="596" y="220" class="field-label">Format</text>
      <text x="596" y="242" class="field-value">Iceberg · metrics</text>
      <text x="596" y="260" class="field-label">Writer</text>
      <text x="596" y="282" class="field-value">Data Scientist</text>
      <text x="596" y="360" class="example-label">E-COMMERCE EXAMPLE</text>
      <text x="596" y="374" class="example-value focal-text">daily conversion rate</text>
      <text x="596" y="388" class="example-value focal-text">revenue by channel</text>

      <!-- Archive -->
      <rect x="768" y="80" width="172" height="380" rx="6" fill="rgba(255,255,255,0.06)"/>
      <rect x="768" y="80" width="172" height="50" fill="rgba(141,153,168,0.24)" clip-path="url(#clip-archive)"/>
      <rect x="768" y="80" width="172" height="380" rx="6" fill="none" stroke="#B6BEC9" stroke-dasharray="5,3"/>
      <text x="854" y="106" class="tier-title">Archive</text>
      <text x="854" y="144" class="bucket">archive-commerce</text>
      <text x="784" y="180" class="field-label">Tool</text>
      <text x="784" y="202" class="field-value">Object storage lifecycle</text>
      <text x="784" y="220" class="field-label">Format</text>
      <text x="784" y="242" class="field-value">Cold tier · immutable</text>
      <text x="784" y="260" class="field-label">Writer</text>
      <text x="784" y="282" class="field-value">Data Engineer</text>
      <text x="784" y="360" class="example-label">E-COMMERCE EXAMPLE</text>
      <text x="784" y="374" class="example-value">retained clickstream</text>
      <text x="784" y="388" class="example-value">closed order snapshots</text>

      <!-- Write-method paths -->
      <rect x="16" y="476" width="460" height="56" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.20)"/>
      <rect x="24" y="482" width="64" height="12" rx="2" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="0.8"/>
      <text x="56" y="491" class="path-tag" fill="#FFFFFF" font-size="7" text-anchor="middle">SQL PATH</text>
      <text x="96" y="506" class="path-title">Trino INSERT INTO … SELECT</text>
      <text x="96" y="522" class="path-sub">filter · join · aggregate — repeatable transforms</text>
      <rect x="492" y="476" width="460" height="56" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.20)"/>
      <rect x="500" y="482" width="96" height="12" rx="2" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="0.8"/>
      <text x="548" y="491" class="path-tag" fill="#FFFFFF" font-size="7" text-anchor="middle">NOTEBOOK PATH</text>
      <text x="604" y="506" class="path-title">Python notebooks on object storage</text>
      <text x="604" y="522" class="path-sub">explore · validate · model — interactive analysis</text>
    </svg>
