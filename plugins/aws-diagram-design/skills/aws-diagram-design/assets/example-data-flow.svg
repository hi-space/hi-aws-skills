<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-flow-title data-flow-desc">
      <title id="data-flow-title">Role-scoped analytics data flow</title>
      <desc id="data-flow-desc">A Data Engineer ingests and stores commerce data, a Data Scientist transforms and analyzes it, and an Analyst publishes a dashboard.</desc>
      <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
:root { --paper: #FFFFFF; --paper-2: #F2F3F3; --ink: #232F3E; --muted: #545B64; --soft: #7D8998; --rule: rgba(35,47,62,0.12); --accent: #EC7211; --accent-tint: rgba(255,153,0,0.08); --link: #0972D3; --sans: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; --serif: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; --mono: 'Amazon Ember Mono', ui-monospace, monospace; }
.step-number, .step-label, .lane-label, .role-text, .chip-text,.step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
.step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
.lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
.role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
.node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
.node-sub { fill: var(--muted); font: 400 8.5px var(--sans); text-anchor: middle; }
.node-tool { fill: var(--soft); font: 400 7.5px var(--sans); text-anchor: middle; }
.chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
.focal-text { fill: var(--accent); }
/* /page-css */
    </style>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#545B64"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#EC7211"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#0972D3"/></marker>
      </defs>
      <rect width="728" height="356" fill="#FFFFFF"/>
      <rect x="0" y="36" width="728" height="80" fill="rgba(35,47,62,0.018)"/>
      <rect x="0" y="196" width="728" height="80" fill="rgba(35,47,62,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(35,47,62,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">INGEST</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(35,47,62,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">STORE</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(255,153,0,0.20)"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">TRANSFORM</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(35,47,62,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">ANALYZE</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(35,47,62,0.12)"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">PUBLISH</text>
      </g>

      <g aria-label="Role lanes">
        <text x="70" y="72" class="lane-label">DATA</text><text x="70" y="84" class="lane-label">ENGINEER</text>
        <text x="70" y="152" class="lane-label">DATA</text><text x="70" y="164" class="lane-label">SCIENTIST</text>
        <text x="70" y="232" class="lane-label">ANALYTICS</text><text x="70" y="244" class="lane-label">ANALYST</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M246 76 H258" fill="none" stroke="#545B64" marker-end="url(#arr-muted)"/>
      <path d="M358 76 H412 Q420 76 420 84 V124" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <path d="M470 156 H482" fill="none" stroke="#545B64" marker-end="url(#arr-muted)"/>
      <path d="M582 156 H636 Q644 156 644 164 V204" fill="none" stroke="#0972D3" marker-end="url(#arr-link)"/>
      <rect x="368" y="56" width="48" height="12" rx="2" fill="#FFFFFF"/>
      <text x="392" y="65" fill="#EC7211" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RAW TABLE</text>

      <!-- Data Engineer: Capture Events -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#FFFFFF" stroke="rgba(35,47,62,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(35,47,62,0.12)"/><text x="159" y="53" class="role-text">ENG</text>
      <text x="196" y="67" class="node-title">Capture Events</text><text x="196" y="79" class="node-sub">shop events → batch</text><text x="196" y="91" class="node-tool">NiFi ingest</text>
      <rect x="150" y="98" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="158" y="104" class="chip-text">LS</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">DB</text>

      <!-- Data Engineer: Land Records -->
      <rect x="258" y="44" width="100" height="64" rx="6" fill="#FFFFFF" stroke="rgba(35,47,62,0.25)"/>
      <rect x="262" y="48" width="18" height="10" rx="3" fill="rgba(35,47,62,0.12)"/><text x="271" y="53" class="role-text">ENG</text>
      <text x="308" y="67" class="node-title">Land Records</text><text x="308" y="79" class="node-sub">events · orders</text><text x="308" y="91" class="node-tool">Object storage</text>
      <rect x="262" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="270" y="104" class="chip-text">DB</text>
      <rect x="338" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="346" y="104" class="chip-text">DB</text>

      <!-- Data Scientist: Clean and Model (focal) -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="rgba(255,153,0,0.07)" stroke="#EC7211" stroke-width="1.2"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(255,153,0,0.20)"/><text x="383" y="133" class="role-text focal-text">SCI</text>
      <text x="420" y="147" class="node-title">Clean &amp; Model</text><text x="420" y="159" class="node-sub">raw → trusted table</text><text x="420" y="171" class="node-tool">Trino · notebooks</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="184" class="chip-text">DB</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="184" class="chip-text">TB</text>

      <!-- Data Scientist: Curate Metrics -->
      <rect x="482" y="124" width="100" height="64" rx="6" fill="#FFFFFF" stroke="rgba(35,47,62,0.25)"/>
      <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(35,47,62,0.12)"/><text x="495" y="133" class="role-text">SCI</text>
      <text x="532" y="147" class="node-title">Curate Metrics</text><text x="532" y="159" class="node-sub">conversion · revenue</text><text x="532" y="171" class="node-tool">Trino SQL</text>
      <rect x="486" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="184" class="chip-text">TB</text>
      <rect x="562" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="570" y="184" class="chip-text">TB</text>

      <!-- Analyst: Publish Dashboard -->
      <rect x="594" y="204" width="100" height="64" rx="6" fill="#FFFFFF" stroke="rgba(35,47,62,0.25)"/>
      <rect x="598" y="208" width="18" height="10" rx="3" fill="rgba(35,47,62,0.12)"/><text x="607" y="213" class="role-text">ANL</text>
      <text x="644" y="227" class="node-title">Publish Dashboard</text><text x="644" y="239" class="node-sub">metrics → decisions</text><text x="644" y="251" class="node-tool">BI workspace</text>
      <rect x="598" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="264" class="chip-text">TB</text>
      <rect x="674" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="264" class="chip-text">FL</text>
</svg>
