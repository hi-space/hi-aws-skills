<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Content site in production</title>
      <desc id="architecture-desc">Architecture diagram showing reader requests moving through Cloudflare to an Astro origin, MDX bundle, and content CMS.</desc>
        <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
/* /page-css */
    </style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#FFFFFF"/>

        <!-- Zone: Content services (drawn before arrows and nodes) -->
        <rect x="616" y="128" width="164" height="272" rx="8"
              fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
        <rect x="672" y="132" width="52" height="12" rx="2" fill="#FFFFFF"/>
        <text x="698" y="141" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">CONTENT</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="168" y1="272" x2="220" y2="272" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="364" y1="272" x2="416" y2="272" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Exit Astro top→enter MDX bottom; exit Astro bottom→enter CMS top -->
        <path d="M 496,240 H 692 Q 700,240 700,232 V 224"
              fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 496,304 H 692 Q 700,304 700,312 V 320"
              fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Dashed return: Cloudflare→Reader (cached HTML — same orthogonal rules as solid) -->
        <path d="M 220,288 H 168" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="172" y="252" width="48" height="12" rx="2" fill="#FFFFFF"/>
        <text x="196" y="262" fill="#0972D3" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="172" y="278" width="32" height="12" rx="2" fill="#FFFFFF"/>
        <text x="188" y="287" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESP</text>

        <rect x="368" y="252" width="48" height="12" rx="2" fill="#FFFFFF"/>
        <text x="392" y="262" fill="#EC7211" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SSR</text>

        <rect x="632" y="246" width="60" height="12" rx="2" fill="#FFFFFF"/>
        <text x="662" y="255" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READ MDX</text>

        <rect x="632" y="286" width="44" height="12" rx="2" fill="#FFFFFF"/>
        <text x="654" y="295" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

        <!-- Node: Reader -->
        <rect x="40" y="240" width="128" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="240" width="128" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
        <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
        <text x="62" y="257" fill="#7D8998" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="104" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Reader</text>
        <text x="104" y="292" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Browser</text>

        <!-- Node: Cloudflare -->
        <rect x="220" y="240" width="144" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="220" y="240" width="144" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
        <rect x="228" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
        <text x="244" y="257" fill="#7D8998" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="356" y="300" fill="rgba(35,47,62,0.06)" font-size="32" font-weight="600" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">01</text>
        <text x="292" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Cloudflare</text>
        <text x="292" y="292" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pages · cache</text>

        <!-- Node: Astro (focal coral) -->
        <rect x="416" y="240" width="160" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="416" y="240" width="160" height="64" rx="6" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
        <rect x="424" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
        <text x="440" y="257" fill="#EC7211" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
        <text x="568" y="300" fill="rgba(255,153,0,0.10)" font-size="32" font-weight="600" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">02</text>
        <text x="496" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Astro Origin</text>
        <text x="496" y="292" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">SSR + MDX</text>

        <!-- Node: MDX Bundle -->
        <rect x="628" y="160" width="144" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="628" y="160" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="636" y="168" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="652" y="177" fill="#232F3E" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BUN</text>
        <text x="700" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">MDX Bundle</text>
        <text x="700" y="212" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">src/content/*.mdx</text>

        <!-- Node: Content CMS -->
        <rect x="628" y="320" width="144" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="628" y="320" width="144" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
        <rect x="636" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
        <text x="650" y="337" fill="#545B64" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CMS</text>
        <text x="700" y="356" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Content CMS</text>
        <text x="700" y="372" fill="#545B64" font-size="11" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">assets · og images</text>
</svg>
