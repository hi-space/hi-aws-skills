<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
      <title id="layers-title">AI app stack · Where the work actually happens</title>
      <desc id="layers-desc">Layer stack showing model weights, SDK, prompts, agent harness, and UI surface, with the agent harness highlighted as the focal layer.</desc>
        <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
/* /page-css */
    </style>
        </defs>

        <rect width="100%" height="100%" fill="#FFFFFF"/>

        <!-- Direction column (left margin) -->
        <text x="60" y="68" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">ABSTRACTION</text>
        <line x1="80" y1="80" x2="80" y2="400" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="#545B64"/>
        <text x="60" y="416" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">SILICON</text>

        <!-- Stack container hairlines (top + bottom edges) -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
        <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>

        <!-- L5 — UI (top layer, near-white fill) -->
        <rect x="120" y="80" width="840" height="64" fill="#ffffff"/>
        <line x1="120" y1="144" x2="960" y2="144" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
        <text x="140" y="116" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">L5</text>
        <text x="260" y="118" fill="#232F3E" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">UI surface</text>
        <text x="940" y="118" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">chat, editor, canvas</text>

        <!-- L4 — Agent harness (FOCAL, coral tint + coral stroke) -->
        <rect x="120" y="144" width="840" height="64" fill="rgba(255,153,0,0.08)"/>
        <rect x="120" y="144" width="840" height="64" fill="none" stroke="#EC7211" stroke-width="1"/>
        <text x="140" y="180" fill="#EC7211" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" font-weight="600">L4</text>
        <text x="260" y="182" fill="#232F3E" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Agent harness</text>
        <text x="940" y="182" fill="#EC7211" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">tools, memory, loop</text>

        <!-- L3 — Prompt layer -->
        <rect x="120" y="208" width="840" height="64" fill="#FFFFFF"/>
        <line x1="120" y1="272" x2="960" y2="272" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
        <text x="140" y="244" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">L3</text>
        <text x="260" y="246" fill="#232F3E" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Prompt layer</text>
        <text x="940" y="246" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">system, few-shot, caching</text>

        <!-- L2 — SDK -->
        <rect x="120" y="272" width="840" height="64" fill="#F2F3F3"/>
        <line x1="120" y1="336" x2="960" y2="336" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
        <text x="140" y="308" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">L2</text>
        <text x="260" y="310" fill="#232F3E" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">SDK / client</text>
        <text x="940" y="310" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">auth, retries, streaming</text>

        <!-- L1 — Model -->
        <rect x="120" y="336" width="840" height="64" fill="#F2F3F3"/>
        <text x="140" y="372" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">L1</text>
        <text x="260" y="374" fill="#232F3E" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Model weights</text>
        <text x="940" y="374" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">opus, sonnet, haiku</text>

        <!-- Caption -->
        <text x="120" y="456" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">FOCAL LAYER</text>
        <text x="240" y="456" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">The harness is where most product differentiation actually lives — tools, memory, and the loop that stitches model calls into useful work.</text>
      </svg>
