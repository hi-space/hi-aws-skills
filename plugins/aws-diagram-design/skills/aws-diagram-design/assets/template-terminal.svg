<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="[diagram-slug]-title [diagram-slug]-desc">
          <title id="[diagram-slug]-title">[Diagram title]</title>
          <desc id="[diagram-slug]-desc">[One sentence describing what the diagram shows]</desc>
          <!-- AWS skin tokens: paper #141414 · text #e6e6e6 · muted #9a9a9a · accent #ff5a36 · mono type throughout (primitive-terminal.md); the CLI-window chrome of 1.x was HTML and is gone — the canvas is the deliverable.
               Fonts: 'Amazon Ember' (names, titles) · 'Amazon Ember Mono' (sublabels, arrow labels). Keep the fallback stacks.
               Replace [diagram-slug] everywhere, fill <title>/<desc>, draw arrows before nodes, then run scripts/finalize.py. -->
          <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
svg { width: 100%; min-width: 900px; display: block; }
/* /page-css */
    </style>
            <marker
              id="arrow"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#9a9a9a" />
            </marker>
            <marker
              id="arrow-accent"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <polygon points="0 0, 8 3, 0 6" fill="#ff5a36" />
            </marker>

            <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#dots)"/> after the paper rect to enable. -->
            <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.08)"/>
          </pattern>
          --></defs>

          <rect width="100%" height="100%" fill="#141414" />

          <!-- Draw arrows first, then nodes. Replace with your content.
             Text sizes run ~1-2px above the default scale: node-name 14px,
             sublabel/arrow-label 9-10px, hub label 18px. See primitive-terminal.md. -->
        </svg>
