        <rect x="60" y="160" width="200" height="40" rx="6" fill="rgba(35,47,62,0.04)" stroke="none"/>
        <rect x="60" y="192" width="200" height="8" fill="rgba(35,47,62,0.04)"/>
        <line x1="60" y1="200" x2="260" y2="200" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
        <text x="76" y="176" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="76" y="192" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Author</text>
        <text x="76" y="220" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace"># id</text>
        <text x="220" y="220" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="76" y="240" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">handle</text>
        <text x="220" y="240" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="76" y="260" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">name</text>
        <text x="220" y="260" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="76" y="280" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">bio</text>
        <text x="220" y="280" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="76" y="300" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">site_url</text>
        <text x="220" y="300" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>

