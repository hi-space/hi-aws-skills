<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
      <title id="er-title">Content platform · data model</title>
      <desc id="er-desc">Entity-relationship diagram showing authors writing articles and articles connecting to tags and categories.</desc>
        <defs>
    <style>
/* page-css */
@font-face { font-family: 'Amazon Ember'; font-weight: 300; font-style: normal; src: local('Amazon Ember Light'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember'; font-weight: 800; font-style: normal; src: local('Amazon Ember Heavy'), local('Amazon Ember'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'); }
@font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'); }
/* /page-css */
    </style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#FFFFFF"/>

        <!-- Relationship lines (drawn first) -->
        <!-- 1. Author — Article (1:N "writes") -->
        <line x1="260" y1="240" x2="400" y2="240" stroke="#545B64" stroke-width="1" />
        <!-- 2. Article — ArticleTag (1:N) -->
        <path d="M 640,320 H 702 Q 710,320 710,328 H 780" fill="none" stroke="#545B64" stroke-width="1"/>
        <!-- 3. Tag — ArticleTag (1:N, vertical) -->
        <line x1="880" y1="248" x2="880" y2="280" stroke="#545B64" stroke-width="1" />

        <!-- Cardinality labels -->
        <rect x="266" y="232" width="12" height="12" rx="2" fill="#FFFFFF"/>
        <text x="272" y="242" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="378" y="232" width="16" height="12" rx="2" fill="#FFFFFF"/>
        <text x="386" y="242" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="646" y="316" width="12" height="12" rx="2" fill="#FFFFFF"/>
        <text x="652" y="326" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="760" y="324" width="16" height="12" rx="2" fill="#FFFFFF"/>
        <text x="768" y="334" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="872" y="252" width="16" height="12" rx="2" fill="#FFFFFF"/>
        <text x="880" y="262" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="872" y="268" width="16" height="12" rx="2" fill="#FFFFFF"/>
        <text x="880" y="278" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">N</text>

        <!-- Relationship labels -->
        <rect x="304" y="220" width="56" height="14" rx="2" fill="#FFFFFF"/>
        <text x="332" y="230" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">WRITES</text>

        <rect x="688" y="300" width="56" height="14" rx="2" fill="#FFFFFF"/>
        <text x="716" y="310" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">TAGGED</text>

