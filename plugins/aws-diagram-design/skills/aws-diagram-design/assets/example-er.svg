        <rect x="400" y="120" width="240" height="240" rx="6" fill="rgba(255,153,0,0.04)" stroke="#EC7211" stroke-width="1"/>
        <rect x="400" y="120" width="240" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="none"/>
        <rect x="400" y="152" width="240" height="8" fill="rgba(255,153,0,0.10)"/>
        <line x1="400" y1="160" x2="640" y2="160" stroke="rgba(236,114,17,0.40)" stroke-width="1"/>
        <text x="416" y="136" fill="#EC7211" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="416" y="152" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Article</text>
        <text x="416" y="180" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace"># id</text>
        <text x="600" y="180" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="416" y="200" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">title</text>
        <text x="600" y="200" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="416" y="220" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">slug</text>
        <text x="600" y="220" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text · unique</text>
        <text x="416" y="240" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">body_mdx</text>
        <text x="600" y="240" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="416" y="260" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">published_at</text>
        <text x="600" y="260" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">timestamp</text>
        <text x="416" y="280" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">→ author_id</text>
        <text x="600" y="280" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="416" y="300" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">status</text>
        <text x="600" y="300" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">enum</text>
        <text x="416" y="320" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">og_image</text>
        <text x="600" y="320" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text · url</text>

        <!-- Entity: Tag -->
        <rect x="780" y="120" width="200" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="780" y="120" width="200" height="40" rx="6" fill="rgba(35,47,62,0.04)" stroke="none"/>
        <rect x="780" y="152" width="200" height="8" fill="rgba(35,47,62,0.04)"/>
        <line x1="780" y1="160" x2="980" y2="160" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
        <text x="796" y="136" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="796" y="152" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Tag</text>
        <text x="796" y="180" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace"># id</text>
        <text x="940" y="180" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="796" y="200" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">slug</text>
        <text x="940" y="200" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text · unique</text>
        <text x="796" y="220" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">name</text>
        <text x="940" y="220" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="796" y="240" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">description</text>
        <text x="940" y="240" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>

        <!-- Entity: ArticleTag (join) -->
        <rect x="780" y="280" width="200" height="96" rx="6" fill="rgba(35,47,62,0.04)" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="780" y="280" width="200" height="40" rx="6" fill="rgba(35,47,62,0.06)" stroke="none"/>
        <rect x="780" y="312" width="200" height="8" fill="rgba(35,47,62,0.06)"/>
        <line x1="780" y1="320" x2="980" y2="320" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
        <text x="796" y="296" fill="#545B64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">JOIN</text>
        <text x="796" y="312" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">ArticleTag</text>
        <text x="796" y="340" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">→ article_id</text>
        <text x="940" y="340" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="796" y="360" fill="#232F3E" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">→ tag_id</text>
        <text x="940" y="360" fill="#545B64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
</svg>
