version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # 데이터셋 ZIP 자동 재생성 스텝(선택). 골격에는 build-dataset-zips.sh가 없으므로
        # 실패해도 무시하고 넘어간다(커밋된 ZIP이 있으면 그대로 사용). 데이터셋을 쓰면
        # scripts/build-dataset-zips.sh를 추가하고 아래 줄을 유지하라.
        - bash scripts/build-dataset-zips.sh || echo "WARN zip step skipped (no script yet)"
        - npm run docs:build
  artifacts:
    baseDirectory: docs/.vitepress/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
