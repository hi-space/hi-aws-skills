# brief.yaml — the fixed values for this workshop (SSOT, Single Source of Truth).
# Once finalized at intake, it is read-only. To change it, do an explicit amend → regenerate only the affected stages.
# All generated content never violates these values. (e.g., tech_level=L200 but you pile up only L400 pitfalls → QA fails)

schema_version: 1

workshop:
  title: "Quick Desktop으로 시작하는 사내 AI 업무 자동화"
  mode: staged              # staged (SA gate) | oneshot (fully automatic)
  languages: [ko, en, ja]   # the first is the default locale
  format: hands-on          # hands-on | booth | presenter-led

engagement:                 # ← the unchanging "engagement facts". Stamped as-is onto the cover, co-branding, and schedule.
  customer:
    name: "한빛페이"
    logo: assets/customer/hanbitpay.svg   # ASK the SA for the image file at intake; if none, null → wordmark text only
    favicon: assets/customer/hanbitpay-favicon.png  # ASK at intake; if null, derived from logo or theme-color placeholder
    industry: "간편결제 PG"
    size: "임직원 210명 · 일 180만 트랜잭션"
  date: 2026-09-15          # engagement date
  duration_min: 90          # engagement duration (minutes)
  venue: "고객사 세미나실 (온사이트)"

audience:                   # ← drives the persona evaluation matrix (persona-rubric.md)
  levels: [L200, L300]
  roles: [개발자, 아키텍트, 데이터/ML]
  primary_tech_level: L200  # default when a scenario does not specify

design:                     # ← ASK at intake; every value may be "auto" → derived per branding.md §Design derivation
  primary_color: "#0A2540"  # brand primary (usually from the customer logo/official brand color)
  accent_color: auto        # auto → complementary to primary
  mood: ["정갈한", "엔터프라이즈"]  # feel keywords (drives illustration style, hero tone, warning depth)
  appearance: dark          # site default: dark | light (quick-* convention: dark)
  source: given             # given (SA chose) | derived (auto) — label, never erased

aws:
  services:                 # ← the research (stage 2) targets. GA/region/preview verified in feature-facts.
    - Amazon Bedrock AgentCore
    - Amazon Bedrock Knowledge Bases
  region: ap-northeast-2    # the basis for the region-availability verdict

scenarios:                  # ← finalized use cases → scenarios. Scene decomposition happens in the blueprint (stage 3).
  - id: a
    title: "매출 이상 탐지 자동화"
    use_case: "일 180만 트랜잭션에서 이상 매출 SKU를 자동 탐지·브리핑"
    tech_level: L200        # if omitted, audience.primary_tech_level
  - id: b
    title: "정산 배치 보안 대응"
    use_case: "정산 배치의 SSRF 침해를 조사·대응"
    tech_level: L300

deploy:
  target: amplify
  private: true             # includes the customer logo → deploy only to an access-controlled location
